[package]
name = "arc"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.6", default-features = false, features = ["component", "tree-sitter", "tree-sitter-html"] }
anyhow = "1.0"
reqwest = { version = "0.13", features = ["json", "query", "cookies"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5"
rust-embed = "8.11"
strum = { version = "0.26", features = ["derive"] }
trash = "5.2.6"
walkdir = "2"
indexmap = "2"
