[package]
name = "gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "b77f352589503a114cdf709507c0738a88e28364", features = ["tree-sitter"] }
anyhow = "1.0"
reqwest = { version = "0.13", features = ["json", "query", "cookies"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5"
rust-embed = "8.11"
strum = { version = "0.26", features = ["derive"] }
trash = "5.2.6"
walkdir = "2"
indexmap = "2"
