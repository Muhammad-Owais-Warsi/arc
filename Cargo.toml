[workspace]
members = [
    "crates/arc",
    # "crates/workspace",
    "crates/ui",
    "crates/ui_macros",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit", "runtime_shaders"] }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }

arc = { path = "crates/arc" }
ui = { path = "crates/ui" }
ui-macros = { path = "crates/ui_macros" }
workspace = { path = "crates/workspace" }

anyhow = "1.0"
log = "0.4"
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "7.0.0"
raw-window-handle = "0.6.2"
ropey = { version = "=2.0.0-beta.1", features = ["metric_lines_lf", "metric_utf16"] }
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
smallvec = "1"
smol = "2"
tracing = "0.1.41"
reqwest = { version = "0.13", features = ["json", "query", "cookies"] }

[workspace.dependencies.windows]
features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices"]
version = "0.58.0"
